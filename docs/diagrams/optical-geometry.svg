<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">90&#176; nephelometric geometry (top view)</text>

  <!-- Opaque chamber outline -->
  <rect x="230" y="120" width="360" height="360" rx="14" fill="#f7f7f7" stroke="#333" stroke-width="3" stroke-dasharray="2,0"/>
  <text x="410" y="145" font-size="13" fill="#555">Opaque chamber (blocks ambient light)</text>

  <!-- Sample chamber (circle) -->
  <circle cx="410" cy="320" r="70" fill="#eaf3ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="410" y="325" text-anchor="middle" font-size="14" fill="#1a365d">Water</text>
  <text x="410" y="342" text-anchor="middle" font-size="14" fill="#1a365d">sample</text>

  <!-- LED axis (from left) -->
  <line x1="250" y1="320" x2="340" y2="320" stroke="#dd6b20" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <rect x="190" y="298" width="60" height="44" rx="6" fill="#fff5eb" stroke="#dd6b20" stroke-width="2"/>
  <text x="220" y="316" text-anchor="middle" font-size="12" fill="#7b341e">IR LED</text>
  <text x="220" y="330" text-anchor="middle" font-size="11" fill="#7b341e">850nm</text>

  <!-- Measurement photodiode at 90 (from bottom, looking up) -->
  <line x1="410" y1="470" x2="410" y2="384" stroke="#2f855a" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <rect x="380" y="470" width="60" height="44" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="410" y="488" text-anchor="middle" font-size="12" fill="#22543d">Photodiode</text>
  <text x="410" y="502" text-anchor="middle" font-size="11" fill="#22543d">measurement (90&#176;)</text>

  <!-- 90 degree angle marker -->
  <path d="M 370 320 A 40 40 0 0 0 410 360" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="345" y="368" font-size="13" fill="#666">90&#176;</text>

  <!-- Reference photodiode, small side chamber near LED, isolated from sample -->
  <rect x="190" y="360" width="80" height="50" rx="6" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="230" y="380" text-anchor="middle" font-size="12" fill="#44337a">Reference</text>
  <text x="230" y="394" text-anchor="middle" font-size="11" fill="#44337a">photodiode</text>
  <line x1="220" y1="342" x2="225" y2="362" stroke="#6b46c1" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowPurple)"/>
  <text x="120" y="405" font-size="11" fill="#666" width="140">senses LED</text>
  <text x="120" y="418" font-size="11" fill="#666">leakage, isolated</text>
  <text x="120" y="431" font-size="11" fill="#666">from the sample</text>

  <!-- Baffle between LED straight path and measurement photodiode to block direct light -->
  <rect x="330" y="360" width="10" height="60" fill="#333"/>
  <text x="300" y="450" font-size="11" fill="#666">baffle blocks</text>
  <text x="300" y="463" font-size="11" fill="#666">direct (0&#176;) light</text>

  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dd6b20"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f855a"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b46c1"/></marker>
  </defs>

  <!-- Legend / explanation -->
  <text x="230" y="520" font-size="13" fill="#333" font-weight="bold">Why 90&#176;?</text>
  <text x="230" y="540" font-size="12" fill="#333">Straight-through light (SEN0189-style) saturates at high turbidity: past a point,</text>
  <text x="230" y="556" font-size="12" fill="#333">so much light scatters away that the reading looks like *less* turbidity, not more.</text>
  <text x="230" y="572" font-size="12" fill="#333">Measuring scattered light at 90&#176; (ISO 7027 nephelometry) avoids that saturation</text>
  <text x="230" y="588" font-size="12" fill="#333">and is far less sensitive to particle color/size than transmittance.</text>

  <text x="450" y="608" text-anchor="middle" font-size="11" fill="#a0aec0">Conceptual diagram - see docs/optical-design.md for the full BOM and electrical schematic</text>
</svg>
