}

android {
    namespace 'org.citizenscience.turbimeter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.Turbidimeter.main'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
