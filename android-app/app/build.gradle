plugins {
    id 'com.android.application'
}

android {
    namespace 'org.citizenscience.turbimeter'
    compileSdk 35

    defaultConfig {
        applicationId 'org.citizenscience.turbimeter'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
